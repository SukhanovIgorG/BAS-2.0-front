name: Check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - dev
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main
      - dev
    types: [opened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node and install deps
        uses: ./.github/actions/node-setup
      - name: Lint
        run: yarn lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node and install deps
        uses: ./.github/actions/node-setup
      - name: Test
        run: yarn test
